<div class="flex min-h-screen bg-background-light">
    <!-- Left side with image/illustration -->
    <div class="hidden lg:flex lg:w-1/2 bg-primary items-center justify-center">
        <div class="max-w-md p-8">
            <app-task-illustration class="w-full h-auto"></app-task-illustration>

            <h2 class="text-white text-3xl font-bold mt-8">Organize your tasks</h2>
            <p class="text-white/80 mt-4">Get started with Dotask and keep track of everything you need to do. Sign in
                to manage your projects and tasks.</p>
        </div>
    </div>

    <!-- Right side with login form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold text-primary">Welcome back</h1>
                <p class="text-text mt-3">Sign in to continue to Dotask</p>
            </div>

            <form class="space-y-6">
                <!-- Email field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-text-dark mb-1">Email</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <mat-icon class="h-5 w-5" [ngStyle]="{ color: 'var(--color-text)' }">email</mat-icon>
                        </div>
                        <input type="email" id="email" name="email" required
                            class="bg-background/50 border border-background-dark focus:border-primary focus:ring-2 focus:ring-primary/20 block w-full pl-10 pr-3 py-3 rounded-lg text-text-dark placeholder:text-text/60 outline-none transition-all duration-200"
                            placeholder="your.email@example.com">
                    </div>
                </div>

                <!-- Password field -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-text-dark">Password</label>
                        <a href="#" class="text-sm text-secondary hover:text-secondary-dark font-medium">Forgot
                            password?</a>
                    </div>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <mat-icon class="h-5 w-5" [ngStyle]="{ color: 'var(--color-text)' }">lock</mat-icon>
                        </div>
                        <input type="password" id="password" name="password" required
                            class="bg-background/50 border border-background-dark focus:border-primary focus:ring-2 focus:ring-primary/20 block w-full pl-10 pr-3 py-3 rounded-lg text-text-dark placeholder:text-text/60 outline-none transition-all duration-200"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Remember me checkbox -->
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                        class="h-4 w-4 border-background-dark rounded text-primary focus:ring-primary/50">
                    <label for="remember" class="ml-2 block text-sm text-text">
                        Remember me
                    </label>
                </div>

                <!-- Sign in button -->
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 rounded-lg text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all duration-200 font-medium">
                    <mat-icon class="mr-2">login</mat-icon>
                    Sign in
                </button>

                <div class="text-center text-sm text-text mt-4">
                    Don't have an account?
                    <a class="font-medium text-secondary hover:text-secondary-dark" routerLink="/signup">
                        Sign up
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
