<div class="flex min-h-screen bg-background-light">
    <!-- Left side with image/illustration -->
    <div class="hidden lg:flex lg:w-1/2 bg-secondary items-center justify-center">
        <div class="max-w-md p-8">
            <app-signup-illustration class="w-full h-auto"></app-signup-illustration>
            <h2 class="text-white text-3xl font-bold mt-8">Join our community</h2>
            <p class="text-white/80 mt-4">Create your account and start organizing your projects, tracking tasks, and
                boosting your productivity with Dotask.</p>
        </div>
    </div>

    <!-- Right side with signup form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold text-secondary">Get started</h1>
                <p class="text-text mt-3">Sign up for your Dotask account</p>
            </div>

            <form class="space-y-6">
                <!-- Name field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-text-dark mb-1">Full name</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <mat-icon class="h-5 w-5" [ngStyle]="{ color: 'var(--color-text)' }">person</mat-icon>
                        </div>
                        <input type="text" id="name" name="name" required
                            class="bg-background/50 border border-background-dark focus:border-secondary focus:ring-2 focus:ring-secondary/20 block w-full pl-10 pr-3 py-3 rounded-lg text-text-dark placeholder:text-text/60 outline-none transition-all duration-200"
                            placeholder="John Doe">
                    </div>
                </div>

                <!-- Email field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-text-dark mb-1">Email</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <mat-icon class="h-5 w-5" [ngStyle]="{ color: 'var(--color-text)' }">email</mat-icon>
                        </div>
                        <input type="email" id="email" name="email" required
                            class="bg-background/50 border border-background-dark focus:border-secondary focus:ring-2 focus:ring-secondary/20 block w-full pl-10 pr-3 py-3 rounded-lg text-text-dark placeholder:text-text/60 outline-none transition-all duration-200"
                            placeholder="your.email@example.com">
                    </div>
                </div>

                <!-- Password field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-text-dark mb-1">Password</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <mat-icon class="h-5 w-5" [ngStyle]="{ color: 'var(--color-text)' }">lock</mat-icon>
                        </div>
                        <input type="password" id="password" name="password" required
                            class="bg-background/50 border border-background-dark focus:border-secondary focus:ring-2 focus:ring-secondary/20 block w-full pl-10 pr-3 py-3 rounded-lg text-text-dark placeholder:text-text/60 outline-none transition-all duration-200"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Confirm Password field -->
                <div class="mb-12">
                    <label for="confirmPassword" class="block text-sm font-medium text-text-dark mb-1">Confirm
                        Password</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <mat-icon class="h-5 w-5" [ngStyle]="{ color: 'var(--color-text)' }">lock_outline</mat-icon>
                        </div>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            class="bg-background/50 border border-background-dark focus:border-secondary focus:ring-2 focus:ring-secondary/20 block w-full pl-10 pr-3 py-3 rounded-lg text-text-dark placeholder:text-text/60 outline-none transition-all duration-200"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Sign up button -->
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 rounded-lg text-white bg-secondary hover:bg-secondary-dark focus:outline-none focus:ring-2 focus:ring-secondary/50 transition-all duration-200 font-medium">
                    <mat-icon class="mr-2">person_add</mat-icon>
                    Create account
                </button>

                <div class="text-center text-sm text-text mt-4">
                    Already have an account?
                    <a class="font-medium text-primary hover:text-primary-dark" routerLink="/">
                        Sign in
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
